name = "linhisreal/rivue_remote"
version = "0.5.0-beta.1"
description = "Client/server requests and events over RemoteEvents, with rate limits. Companion to Rivue"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["linhisreal"]
repository = "https://github.com/linhisreal/Rivue"
includes = ["pesde.toml", "README.md", "LICENSE.md", "src/**/*.luau"]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"
