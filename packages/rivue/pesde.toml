name = "linhisreal/rivue"
version = "2.56.0"
description = "Vue 3's component model for Roblox UI, in Luau"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["linhisreal"]
repository = "https://github.com/linhisreal/Rivue"
includes = ["pesde.toml", "README.md", "LICENSE.md", "default.project.json", "src/**/*.luau"]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"
