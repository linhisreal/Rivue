name = "linhisreal/rivue_ui"
version = "0.10.0-rc.1"
description = "Vue 3's component model for Roblox UI, in Luau"
license = "LicenseRef-Rivue"
authors = ["linhisreal"]
repository = "https://github.com/linhisreal/Rivue"
includes = ["pesde.toml", "README.md", "LICENSE.md", "src/**/*.luau"]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"
