name: Tests in Roblox

# Runs the test suites in a real Roblox server through Open Cloud. Needs the ROBLOX_API_KEY
# secret, and ROBLOX_UNIVERSE_ID and ROBLOX_PLACE_ID as variables or secrets (see docs/RELEASING.md)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["packages/**", "tests/**", "dev/**", "examples/**", ".lune/cloud-test.luau"]

concurrency:
  group: roblox-tests
  cancel-in-progress: false

jobs:
  roblox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Run the tests in Roblox
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID || secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID || secrets.ROBLOX_PLACE_ID }}
        run: |
          missing=""
          [ -z "$ROBLOX_API_KEY" ] && missing="$missing ROBLOX_API_KEY"
          [ -z "$ROBLOX_UNIVERSE_ID" ] && missing="$missing ROBLOX_UNIVERSE_ID"
          [ -z "$ROBLOX_PLACE_ID" ] && missing="$missing ROBLOX_PLACE_ID"
          if [ -n "$missing" ]; then
            echo "::notice::Skipped: not set in the repo's Actions secrets and variables:$missing"
            exit 0
          fi
          lune run cloud-test
