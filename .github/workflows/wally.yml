name: Wally package

# Packs Rivue the way `wally publish` would, without publishing, and checks the package builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["wally.toml", "default.project.json", "src/shared/Rivue/**", ".github/workflows/wally.yml"]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Install Wally
        run: |
          # Outside the checkout, so it isn't packaged
          curl -sSfL -o "$RUNNER_TEMP/wally.zip" https://github.com/UpliftGames/wally/releases/download/v0.3.2/wally-v0.3.2-linux.zip
          unzip -q "$RUNNER_TEMP/wally.zip" -d "$RUNNER_TEMP/wally-bin"
          chmod +x "$RUNNER_TEMP/wally-bin/wally"
          echo "$RUNNER_TEMP/wally-bin" >> "$GITHUB_PATH"

      - name: Files in the package
        run: wally package --list

      - name: Build the package like a Wally user's Rojo project would
        run: |
          wally package --output "$RUNNER_TEMP/rivue-package.zip"
          mkdir "$RUNNER_TEMP/unpacked" && unzip -q "$RUNNER_TEMP/rivue-package.zip" -d "$RUNNER_TEMP/unpacked"
          # Rojo runs from the checkout, where rokit.toml pins its version
          rojo build "$RUNNER_TEMP/unpacked/default.project.json" -o "$RUNNER_TEMP/rivue-from-wally.rbxm"
          test -f "$RUNNER_TEMP/unpacked/src/shared/Rivue/Rivue.luau"
          ! test -e "$RUNNER_TEMP/unpacked/tests"
          ! test -e "$RUNNER_TEMP/unpacked/src/shared/RivueRemote.luau"
          echo "Package builds into Rivue"
