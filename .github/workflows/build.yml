name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

jobs:
  check:
    name: Format, types, tests, docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Format
        run: stylua --check src tests examples .lune

      - name: Type check
        run: |
          rojo sourcemap default.project.json -o sourcemap.json
          curl -sSfL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau
          luau-lsp analyze --sourcemap=sourcemap.json --definitions=globalTypes.d.luau src/ examples/
          lune setup
          luau-lsp analyze --platform=standard .lune

      - name: Tests
        run: lune run test

      - name: Docs (links resolve, every API example runs)
        run: lune run check-docs

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - run: lune run build minify

      - uses: actions/upload-artifact@v4
        with:
          name: rivue
          path: build/*.rbx*
          retention-days: 30
