name: Packages

# Packs every package for Wally and pesde the way publishing would, without publishing, and checks
# each one builds in Rojo like it would in someone's Packages folder
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["packages/**", "pesde.toml", "rokit.toml", ".github/workflows/packages.yml"]

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [rivue, rivue-remote, rivue-router]
    steps:
      - uses: actions/checkout@v7

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: pesde install
        run: pesde install

      - name: Wally package
        run: |
          wally package --project-path packages/${{ matrix.package }} --list
          wally package --project-path packages/${{ matrix.package }} --output "$RUNNER_TEMP/package.zip"
          mkdir "$RUNNER_TEMP/unpacked"
          unzip -q "$RUNNER_TEMP/package.zip" -d "$RUNNER_TEMP/unpacked"
          # Rojo runs from the checkout, where rokit.toml pins its version
          rojo build "$RUNNER_TEMP/unpacked" -o "$RUNNER_TEMP/from-wally.rbxm"
          ! test -e "$RUNNER_TEMP/unpacked/tests"

      - name: pesde publish (dry run)
        working-directory: packages/${{ matrix.package }}
        run: pesde publish --dry-run --yes
