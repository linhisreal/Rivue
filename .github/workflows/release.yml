name: Release

# Publish a release with Rivue.rbxm and Rivue.min.rbxm attached, either by pushing a tag
# (v2.56.0, or pre-v2.56 for a pre-release) or by running this workflow from the Actions tab,
# which creates the tag on the current main. Notes come from .github/release-notes/<tag>.md.
on:
  push:
    tags: ["v*", "pre-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create and release (pre-* tags become pre-releases)
        required: true
        default: pre-v2.56

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Tests
        run: lune run test

      - run: lune run build minify

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          prerelease: ${{ startsWith(env.TAG, 'pre-') }}
          body_path: .github/release-notes/${{ env.TAG }}.md
          files: |
            build/Rivue.rbxm
            build/Rivue.min.rbxm
            build/RivueRemote.rbxm
            build/RivueDevTools.rbxm
