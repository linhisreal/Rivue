name: Release

# Push a tag like v1.0.0 to publish a release with Rivue.rbxm and Rivue.min.rbxm attached
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Tests
        run: lune run test

      - run: lune run build minify

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Rivue.rbxm
            build/Rivue.min.rbxm
          generate_release_notes: true
