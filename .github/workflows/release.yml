name: Release

on:
  push:
    tags: ["v*", "pre-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create and release (pre-* tags become pre-releases)
        required: true
        default: pre-v2.58.4a

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Tests
        run: lune run test

      - run: lune run build minify

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          prerelease: ${{ startsWith(env.TAG, 'pre-') }}
          body_path: .github/release-notes/${{ env.TAG }}.md
          files: |
            build/RivueUI.rbxm
            build/RivueUI.min.rbxm
            build/RivueRemote.rbxm
            build/RivueRouter.rbxm
            build/RivueDevTools.rbxm
