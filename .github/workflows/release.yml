name: Release

# Push a tag like v2.56.0 to publish a release with Rivue.rbxm and Rivue.min.rbxm attached.
# Tags starting with "pre-" (pre-v2.56) are published as pre-releases.
on:
  push:
    tags: ["v*", "pre-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Tests
        run: lune run test

      - run: lune run build minify

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Rivue.rbxm
            build/Rivue.min.rbxm
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'pre-') }}
