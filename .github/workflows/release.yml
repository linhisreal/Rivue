name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create and release (tags like v1.2.0-beta.1 become pre-releases)
        required: true
        default: v1.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          cache: true

      - name: Tests
        run: lune run test

      - run: lune run build minify

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          body_path: .github/release-notes/${{ env.TAG }}.md
          files: |
            build/RivueUI.rbxm
            build/RivueUI.min.rbxm
            build/RivueRemote.rbxm
            build/RivueRouter.rbxm
            build/RivueDevTools.rbxm
