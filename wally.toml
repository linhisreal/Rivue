[package]
name = "linhisreal/rivue"
description = "Vue 3's component model for Roblox UI, in Luau"
version = "2.56.0"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["linhisreal"]
realm = "shared"
registry = "https://github.com/UpliftGames/wally-index"
repository = "https://github.com/linhisreal/Rivue"
# Only the library and its project file are packaged
exclude = [
	".github",
	".lune",
	".vscode",
	"assets",
	"build",
	"docs",
	"examples",
	"tests",
	"src/client",
	"src/server",
	"src/shared/Demo",
	"src/shared/RivueRemote.luau",
	"place.project.json",
	"plugin.project.json",
	"src/plugin",
	"examples.project.json",
	"rivue-remote.project.json",
	"rokit.toml",
	"stylua.toml",
	".stylua.toml",
	".darklua.json",
]
