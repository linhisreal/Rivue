<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" width="780" height="270">
<title>a value read in render versus a bound property</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
<rect width="780" height="270" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<text x="24" y="34" font-size="14" font-weight="700" fill="#1f2328">Read in render</text>
<text x="404" y="34" font-size="14" font-weight="700" fill="#1f2328">Bound with Rivue.bind</text>
<line x1="390" y1="20" x2="390" y2="250" stroke="#d0d7de"/>

<rect x="24" y="56" width="120" height="40" rx="6" fill="#eef2f7" stroke="#d0d7de"/>
<text x="84" y="81" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">seconds ref</text>
<line x1="144" y1="76" x2="186" y2="76" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
<rect x="190" y="56" width="176" height="40" rx="6" fill="#fb8f44"/>
<text x="278" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Timer component</text>
<text x="278" y="89" text-anchor="middle" font-size="11" fill="#ffffff">render runs again</text>
<line x1="278" y1="96" x2="278" y2="128" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
<rect x="190" y="132" width="176" height="40" rx="6" fill="#fb8f44"/>
<text x="278" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">every prop compared</text>
<text x="278" y="165" text-anchor="middle" font-size="11" fill="#ffffff">children checked too</text>
<line x1="278" y1="172" x2="278" y2="198" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
<rect x="190" y="202" width="176" height="32" rx="6" fill="#eef2f7" stroke="#d0d7de"/>
<text x="278" y="223" text-anchor="middle" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">label.Text = "9s"</text>

<rect x="404" y="56" width="120" height="40" rx="6" fill="#eef2f7" stroke="#d0d7de"/>
<text x="464" y="81" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">seconds ref</text>
<line x1="524" y1="76" x2="566" y2="76" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
<rect x="570" y="56" width="186" height="40" rx="6" fill="#2fbf8f"/>
<text x="663" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">binding</text>
<text x="663" y="89" text-anchor="middle" font-size="11" fill="#ffffff">one small effect</text>
<line x1="663" y1="96" x2="663" y2="198" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
<rect x="570" y="202" width="186" height="32" rx="6" fill="#eef2f7" stroke="#d0d7de"/>
<text x="663" y="223" text-anchor="middle" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">label.Text = "9s"</text>
<rect x="404" y="132" width="150" height="40" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="4 3"/>
<text x="479" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#59636e">Timer component</text>
<text x="479" y="165" text-anchor="middle" font-size="11" fill="#59636e">doesn't run</text>
</g>
</svg>
