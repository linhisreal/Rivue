<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300">
<title>an old answer arriving after a newer one</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
<rect width="780" height="300" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="34" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">The player clicks page 1, then quickly page 2</text>
<text x="24" y="84" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">page 1 request</text>
<text x="24" y="134" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">page 2 request</text>
<line x1="170" y1="176" x2="170" y2="100" stroke="#d0d7de" stroke-dasharray="3 3"/>
<line x1="270" y1="176" x2="270" y2="150" stroke="#d0d7de" stroke-dasharray="3 3"/>
<rect x="170" y="64" width="420" height="30" rx="6" fill="#eef2f7" stroke="#d0d7de"/>
<text x="380.0" y="84" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328">waiting for the server (slow)</text>
<rect x="270" y="114" width="150" height="30" rx="6" fill="#eef2f7" stroke="#d0d7de"/>
<text x="345.0" y="134" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328">waiting (fast)</text>
<circle cx="170" cy="79" r="6" fill="#fff" stroke="#59636e" stroke-width="2"/>
<circle cx="270" cy="129" r="6" fill="#fff" stroke="#59636e" stroke-width="2"/>
<circle cx="590" cy="79" r="7" fill="#cf222e"/>
<text x="604" y="84" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#cf222e">arrives last</text>
<circle cx="420" cy="129" r="7" fill="#2fbf8f"/>
<text x="434" y="134" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2fbf8f">arrives first, shown</text>
<path d="M150 176 H740" stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="740" y="198" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">time</text>
<line x1="170" y1="171" x2="170" y2="181" stroke="#59636e" stroke-width="2"/>
<text x="170" y="198" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328">click page 1</text>
<line x1="270" y1="171" x2="270" y2="181" stroke="#59636e" stroke-width="2"/>
<text x="270" y="198" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328">click page 2</text>
<circle cx="36" cy="240" r="9" fill="#cf222e"/><path d="M33 237 L39 243 M39 237 L33 243" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="54" y="245" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">Without a check, page 1's answer replaces page 2. The player asked for page 2 but sees page 1.</text>
<circle cx="36" cy="270" r="9" fill="#2fbf8f"/><path d="M32 270 L35 273 L40 267" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="275" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">With a check, each request remembers its number, and an answer that isn't the latest is dropped.</text>
</svg>
