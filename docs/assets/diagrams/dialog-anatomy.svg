<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300">
<title>the parts of a Dialog</title>
<rect width="780" height="300" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect x="24" y="24" width="420" height="252" rx="6" fill="#8c959f"/>
<rect x="24" y="24" width="420" height="252" rx="6" fill="#000000" opacity="0.45"/>
<text x="36" y="46" font-size="11" fill="#ffffff" opacity="0.8">the game, behind the backdrop</text>
<rect x="124" y="78" width="220" height="150" rx="10" fill="#ffffff"/>
<text x="234" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Leave the match?</text>
<text x="234" y="130" text-anchor="middle" font-size="12" fill="#59636e">You'll lose this round's XP.</text>
<rect x="140" y="164" width="88" height="36" rx="6" fill="#1f6feb" stroke="#ffd33d" stroke-width="3"/>
<text x="184" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Stay</text>
<rect x="240" y="164" width="88" height="36" rx="6" fill="#eef2f7" stroke="#d0d7de"/>
<text x="284" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Leave</text>
<rect x="120" y="74" width="228" height="158" rx="12" fill="none" stroke="#2fbf8f" stroke-width="2" stroke-dasharray="6 4"/>

<g font-size="13" fill="#1f2328">
<line x1="448" y1="56" x2="470" y2="56" stroke="#59636e"/>
<text x="478" y="52" font-weight="600">Backdrop</text>
<text x="478" y="70" fill="#59636e" font-size="12">a click here calls onClose</text>
<line x1="352" y1="110" x2="470" y2="110" stroke="#2fbf8f"/>
<text x="478" y="106" font-weight="600" fill="#1a7f5a">Panel, a SelectionGroup</text>
<text x="478" y="124" fill="#59636e" font-size="12">the gamepad can't leave it</text>
<polyline points="184,204 184,214 360,214 360,182 470,182" fill="none" stroke="#d4a72c"/>
<text x="478" y="178" font-weight="600" fill="#9a6700">First button selected</text>
<text x="478" y="196" fill="#59636e" font-size="12">when a gamepad player opens it</text>
<text x="478" y="240" font-weight="600">Escape or B</text>
<text x="478" y="258" fill="#59636e" font-size="12">also calls onClose</text>
</g>
</g>
</svg>
