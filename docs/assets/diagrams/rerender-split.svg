<line x1="194.0" y1="124" x2="194.0" y2="140" stroke="#8c959f" stroke-width="2"/>
<rect x="155.0" y="140" width="78" height="40" rx="6" fill="#eef2f7" stroke="#d0d7de"/><text x="194.0" y="165.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Ammo</text>
<line x1="325.0" y1="124" x2="325.0" y2="140" stroke="#8c959f" stroke-width="2"/>
<rect x="286.0" y="140" width="78" height="40" rx="6" fill="#eef2f7" stroke="#d0d7de"/><text x="325.0" y="165.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Minimap</text>
<rect x="262.4" y="32" width="95.19999999999999" height="20" rx="10" fill="#ffffff" stroke="#2fbf8f"/><text x="310" y="46" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2fbf8f">10× a second</text>
<text x="24" y="212" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">Hud's whole render runs 10 times a second,</text>
<text x="24" y="230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">just to update one label.</text>
<line x1="390" y1="24" x2="390" y2="240" stroke="#d0d7de" stroke-width="1"/>
<text x="416" y="34" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">After: PingLabel reads ping</text>
<rect x="416" y="60" width="340" height="48" rx="6" fill="#eef2f7" stroke="#d0d7de"/><text x="586.0" y="81.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Hud</text><text x="586.0" y="99.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">reads health, ammo</text>
<line x1="586.0" y1="108" x2="586.0" y2="124" stroke="#8c959f" stroke-width="2"/>
<line x1="455.0" y1="124" x2="717.0" y2="124" stroke="#8c959f" stroke-width="2"/>
<line x1="455.0" y1="124" x2="455.0" y2="140" stroke="#8c959f" stroke-width="2"/>
<rect x="416.0" y="140" width="78" height="40" rx="6" fill="#eef2f7" stroke="#d0d7de"/><text x="455.0" y="165.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Health</text>
<line x1="542.3333333333334" y1="124" x2="542.3333333333334" y2="140" stroke="#8c959f" stroke-width="2"/>
