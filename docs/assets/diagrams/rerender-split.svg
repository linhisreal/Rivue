<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 294" width="780" height="294">
<title>moving a fast-changing read into a small component</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
<rect width="780" height="294" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="34" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Before: Hud reads ping</text>
<rect x="24" y="60" width="340" height="48" rx="6" fill="#2fbf8f"/><text x="194.0" y="81.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Hud</text><text x="194.0" y="99.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fff">reads health, ammo, ping</text>
<line x1="194.0" y1="108" x2="194.0" y2="124" stroke="#8c959f" stroke-width="2"/>
