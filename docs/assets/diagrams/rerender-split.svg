<line x1="629.6666666666666" y1="124" x2="629.6666666666666" y2="140" stroke="#8c959f" stroke-width="2"/>
<rect x="590.6666666666666" y="140" width="78" height="40" rx="6" fill="#eef2f7" stroke="#d0d7de"/><text x="629.6666666666666" y="165.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Minimap</text>
<line x1="717.0" y1="124" x2="717.0" y2="140" stroke="#8c959f" stroke-width="2"/>
<rect x="678.0" y="140" width="78" height="40" rx="6" fill="#2fbf8f"/><text x="717.0" y="165.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">PingLabel</text>
<rect x="669.4" y="184" width="95.19999999999999" height="20" rx="10" fill="#ffffff" stroke="#2fbf8f"/><text x="717.0" y="198" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2fbf8f">10× a second</text>
<text x="416" y="230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">Only the small PingLabel runs 10 times a second.</text>
<rect x="24" y="258" width="16" height="16" rx="3" fill="#2fbf8f"/>
<text x="48" y="271" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">re-renders when ping changes</text>
<rect x="250" y="258" width="16" height="16" rx="3" fill="#eef2f7" stroke="#d0d7de"/>
<text x="274" y="271" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">skipped: nothing it uses changed</text>
</svg>
