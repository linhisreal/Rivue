<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250">
<title>what fade, slide and pop do when an element enters</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
<rect width="780" height="250" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<text x="130" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">fade()</text>
<text x="390" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">slide({ direction = "up" })</text>
<text x="650" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">pop()</text>
<line x1="260" y1="20" x2="260" y2="230" stroke="#d0d7de"/>
<line x1="520" y1="20" x2="520" y2="230" stroke="#d0d7de"/>

<rect x="40" y="70" width="70" height="90" rx="8" fill="#1f6feb" opacity="0.15"/>
<line x1="116" y1="115" x2="140" y2="115" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
<rect x="150" y="70" width="70" height="90" rx="8" fill="#1f6feb"/>

<rect x="300" y="100" width="70" height="90" rx="8" fill="#1f6feb" opacity="0.15"/>
<line x1="376" y1="128" x2="400" y2="104" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
<rect x="410" y="70" width="70" height="90" rx="8" fill="#1f6feb"/>

<rect x="568" y="91" width="42" height="54" rx="6" fill="#1f6feb" opacity="0.15"/>
<line x1="616" y1="118" x2="640" y2="118" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
<rect x="654" y="73" width="70" height="90" rx="8" fill="#1f6feb"/>

<text x="130" y="212" text-anchor="middle" font-size="12" fill="#1f2328">fades in from transparent</text>
<text x="390" y="212" text-anchor="middle" font-size="12" fill="#1f2328">starts 24 px lower, rises as it fades in</text>
<text x="650" y="212" text-anchor="middle" font-size="12" fill="#1f2328">starts at 90% size, grows as it fades in</text>
<text x="390" y="236" text-anchor="middle" font-size="11" fill="#59636e">Leaving plays the same move backwards</text>
</g>
</svg>
