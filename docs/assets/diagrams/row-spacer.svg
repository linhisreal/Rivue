<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 190" width="780" height="190">
<title>a Row with a Spacer pushing the last button to the far end</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
<rect width="780" height="190" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<text x="24" y="34" font-size="12" fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">h(Rivue.Row, { gap = 8 }, { backButton, title, h(Rivue.Spacer), closeButton })</text>
<rect x="24" y="56" width="732" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="36" y="66" width="80" height="36" rx="6" fill="#eef2f7" stroke="#d0d7de"/>
<text x="76" y="89" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Back</text>
<rect x="124" y="66" width="120" height="36" rx="6" fill="#eef2f7" stroke="#d0d7de"/>
<text x="184" y="89" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Inventory</text>
<rect x="252" y="66" width="408" height="36" rx="6" fill="#ffffff" stroke="#2fbf8f" stroke-dasharray="5 4"/>
<line x1="266" y1="92" x2="646" y2="92" stroke="#2fbf8f" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="456" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#1a7f5a">Spacer</text>
<rect x="668" y="66" width="76" height="36" rx="6" fill="#1f6feb"/>
<text x="706" y="89" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Close</text>
<text x="390" y="136" text-anchor="middle" font-size="12" fill="#1f2328">8 px between items. The Spacer takes all the space left over, so Close sits at the far end</text>
<text x="390" y="168" text-anchor="middle" font-size="11" fill="#59636e">A Column does the same top to bottom</text>
</g>
</svg>
