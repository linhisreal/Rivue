<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 264" width="800" height="264">
<title>each call to a composable makes its own state</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
<rect width="800" height="264" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="34" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Two components call useCountdown. Each call gets its own timer.</text>
<text x="24" y="72" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#59636e">still on screen</text>
<rect x="24" y="80" width="220" height="60" rx="6" fill="#1f6feb"/><text x="134.0" y="107.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">RoundTimer</text><text x="134.0" y="125.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fff">useCountdown(90)</text>
<path d="M248 110 H316" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="282" y="102" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e">calls</text>
<rect x="322" y="80" width="200" height="60" rx="6" fill="#2fbf8f"/><text x="422.0" y="107.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">timer</text><text x="422.0" y="125.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fff">left: 90, 89, 88 …</text>
<text x="24" y="172" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#59636e">unmounted</text>
<rect x="24" y="180" width="220" height="60" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="6 4"/><text x="134.0" y="207.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#59636e">SaleBanner</text><text x="134.0" y="225.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636e">useCountdown(3600)</text>
<path d="M248 210 H316" stroke="#8c959f" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="282" y="202" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e">calls</text>
<rect x="322" y="180" width="200" height="60" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="6 4"/><text x="422.0" y="207.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#59636e">timer</text><text x="422.0" y="225.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636e">stopped</text>
<line x1="552" y1="80" x2="552" y2="240" stroke="#d0d7de" stroke-width="2"/>
<text x="570" y="104" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">Each call creates its own refs,</text>
<text x="570" y="124" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">watchers and connections.</text>
<text x="570" y="178" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">They belong to the component</text>
<text x="570" y="198" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">that called it. When SaleBanner</text>
<text x="570" y="218" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">unmounts, only its timer stops.</text>
</svg>
