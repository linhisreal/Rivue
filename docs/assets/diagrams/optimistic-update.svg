<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 284" width="780" height="284">
<title>optimistic update</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
<rect width="780" height="284" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="34" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">The player buys a sword for 40 coins</text>
<rect x="24" y="90" width="160" height="64" rx="6" fill="#eef2f7" stroke="#d0d7de"/><text x="104.0" y="119.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Click Buy</text><text x="104.0" y="137.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">coins: 100</text>
<path d="M188 122 H246" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="217" y="112" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e">instantly</text>
<rect x="252" y="90" width="200" height="64" rx="6" fill="#2fbf8f"/><text x="352.0" y="119.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Screen updates</text><text x="352.0" y="137.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fff">coins: 60, sword owned</text>
<path d="M456 122 H516" stroke="#59636e" stroke-width="2" fill="none"/>
<path d="M516 122 V82 H546" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M516 122 V162 H546" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="484" y="114" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e">later</text>
<rect x="552" y="54" width="206" height="56" rx="6" fill="#1f6feb"/><text x="655.0" y="79.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Server says yes</text><text x="655.0" y="97.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fff">keep it, nothing to do</text>
<rect x="552" y="134" width="206" height="56" rx="6" fill="#cf222e"/><text x="655.0" y="159.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Server says no</text><text x="655.0" y="177.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fff">undo: coins 100, no sword</text>
<line x1="24" y1="214" x2="756" y2="214" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="240" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">The player sees the result the moment they click. If the server refuses (not enough coins,</text>
<text x="24" y="260" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">sold out), the store puts the old values back and the button shows why.</text>
</svg>
