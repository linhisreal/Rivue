<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330">
<title>an old answer arriving after a newer one</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
<rect width="780" height="330" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="34" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">The player clicks page 1, then quickly page 2</text>
<text x="24" y="84" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">page 1 request</text>
<text x="24" y="144" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">page 2 request</text>
<rect x="160" y="64" width="440" height="30" rx="6" fill="#eef2f7" stroke="#d0d7de"/>
<text x="380" y="84" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328">slow server answer</text>
<rect x="260" y="124" width="150" height="30" rx="6" fill="#eef2f7" stroke="#d0d7de"/>
<text x="335" y="144" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328">fast answer</text>
<circle cx="410" cy="139" r="7" fill="#2fbf8f"/>
<circle cx="600" cy="79" r="7" fill="#cf222e"/>
<path d="M150 190 H720" stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="720" y="210" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">time</text>
<line x1="410" y1="146" x2="410" y2="186" stroke="#2fbf8f" stroke-width="2"/>
<line x1="600" y1="86" x2="600" y2="186" stroke="#cf222e" stroke-width="2"/>
<text x="410" y="234" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">page 2 is shown</text>
<text x="600" y="234" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">page 1 arrives last</text>
<text x="40" y="279" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#cf222e">✕</text>
<text x="60" y="278" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">Without a check: page 1 overwrites page 2. The player asked for page 2 but sees page 1.</text>
<text x="40" y="309" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2fbf8f">✓</text>
<text x="60" y="308" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">With a check: each request remembers its number, and an answer that isn't the latest is dropped.</text>
</svg>
