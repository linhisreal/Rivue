<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="780" height="370">
<title>splitting a big render into components</title>
<rect width="780" height="370" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text xml:space="preserve" x="24" y="34" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">Before: one render, 5 levels deep</text>
<rect x="24" y="50" width="300" height="22" rx="4" fill="#eef2f7" stroke="#d0d7de"/>
<text xml:space="preserve" x="32" y="66" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">Frame "Shop"</text>
<rect x="46" y="76" width="278" height="22" rx="4" fill="#eef2f7" stroke="#d0d7de"/>
<text xml:space="preserve" x="54" y="92" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">Frame "Header"</text>
<rect x="68" y="102" width="256" height="22" rx="4" fill="#eef2f7" stroke="#d0d7de"/>
<text xml:space="preserve" x="76" y="118" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">TextLabel "Title"</text>
<rect x="68" y="128" width="256" height="22" rx="4" fill="#eef2f7" stroke="#d0d7de"/>
<text xml:space="preserve" x="76" y="144" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">Frame "Coins"</text>
<rect x="90" y="154" width="234" height="22" rx="4" fill="#eef2f7" stroke="#d0d7de"/>
<text xml:space="preserve" x="98" y="170" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">ImageLabel</text>
<rect x="46" y="180" width="278" height="22" rx="4" fill="#eef2f7" stroke="#d0d7de"/>
<text xml:space="preserve" x="54" y="196" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">ScrollingFrame</text>
<rect x="68" y="206" width="256" height="22" rx="4" fill="#eef2f7" stroke="#d0d7de"/>
<text xml:space="preserve" x="76" y="222" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">Frame "Product"  ×N</text>
<rect x="90" y="232" width="234" height="22" rx="4" fill="#eef2f7" stroke="#d0d7de"/>
<text xml:space="preserve" x="98" y="248" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">Frame "Info"</text>
<rect x="112" y="258" width="212" height="22" rx="4" fill="#eef2f7" stroke="#d0d7de"/>
<text xml:space="preserve" x="120" y="274" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">TextLabel "Name"</text>
<rect x="90" y="284" width="234" height="22" rx="4" fill="#eef2f7" stroke="#d0d7de"/>
<text xml:space="preserve" x="98" y="300" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">Frame "Buy"</text>
<rect x="112" y="310" width="212" height="22" rx="4" fill="#eef2f7" stroke="#d0d7de"/>
<text xml:space="preserve" x="120" y="326" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">TextButton</text>
<rect x="46" y="336" width="278" height="22" rx="4" fill="#eef2f7" stroke="#d0d7de"/>
<text xml:space="preserve" x="54" y="352" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">Frame "Footer"</text>
<text xml:space="preserve" x="380" y="34" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">After: small components, each shallow</text>
<rect x="510" y="60" width="120" height="40" rx="6" fill="#1f6feb"/><text x="570.0" y="85.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Shop</text>
<rect x="380" y="140" width="120" height="40" rx="6" fill="#2fbf8f"/><text x="440.0" y="165.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">ShopHeader</text>
<rect x="510" y="140" width="120" height="40" rx="6" fill="#2fbf8f"/><text x="570.0" y="165.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">ProductList</text>
<rect x="640" y="140" width="120" height="40" rx="6" fill="#2fbf8f"/><text x="700.0" y="165.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">ShopFooter</text>
<rect x="510" y="230" width="120" height="40" rx="6" fill="#2fbf8f"/><text x="570.0" y="255.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">ProductCard  ×N</text>
<line x1="570" y1="100" x2="440" y2="140" stroke="#8c959f" stroke-width="2"/>
<line x1="570" y1="100" x2="570" y2="140" stroke="#8c959f" stroke-width="2"/>
<line x1="570" y1="100" x2="700" y2="140" stroke="#8c959f" stroke-width="2"/>
<line x1="570" y1="180" x2="570" y2="230" stroke="#8c959f" stroke-width="2"/>
<text x="380" y="310" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">Each render fits on a screen, and only the component</text>
<text x="380" y="330" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">that reads changed state re-renders.</text>
</svg>
