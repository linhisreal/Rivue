<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330">
<title>Teleport moves a modal to the top layer</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
<rect width="780" height="330" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="34" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Where you write it</text>
<rect x="24" y="50" width="140" height="36" rx="6" fill="#eef2f7" stroke="#d0d7de"/><text x="94.0" y="73.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">App</text>
<rect x="52" y="98" width="140" height="36" rx="6" fill="#eef2f7" stroke="#d0d7de"/><text x="122.0" y="121.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Shop</text>
<line x1="38" y1="86" x2="38" y2="116" stroke="#8c959f" stroke-width="2"/>
<line x1="38" y1="116" x2="52" y2="116" stroke="#8c959f" stroke-width="2"/>
<rect x="80" y="146" width="140" height="36" rx="6" fill="#eef2f7" stroke="#d0d7de"/><text x="150.0" y="169.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">ItemCard</text>
<line x1="66" y1="134" x2="66" y2="164" stroke="#8c959f" stroke-width="2"/>
<line x1="66" y1="164" x2="80" y2="164" stroke="#8c959f" stroke-width="2"/>
<rect x="108" y="194" width="140" height="36" rx="6" fill="#2fbf8f"/><text x="178.0" y="217.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Modal</text>
<line x1="94" y1="182" x2="94" y2="212" stroke="#8c959f" stroke-width="2"/>
<line x1="94" y1="212" x2="108" y2="212" stroke="#8c959f" stroke-width="2"/>
<text x="406" y="34" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Where it shows up</text>
<rect x="406" y="50" width="350" height="200" rx="8" fill="#eef2f7" stroke="#d0d7de"/>
<text x="420" y="72" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">PlayerGui</text>
<rect x="420" y="84" width="150" height="36" rx="6" fill="#eef2f7" stroke="#d0d7de"/><text x="495.0" y="107.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Shop UI</text>
<rect x="470" y="128" width="270" height="100" rx="6" fill="#2fbf8f"/><text x="605.0" y="175.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Modal frame</text><text x="605.0" y="193.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fff">drawn above everything</text>
<path d="M248 212 C350 212 380 178 464 178" stroke="#1f6feb" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="340" y="234" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f6feb">Teleport</text>
<text x="24" y="286" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">The modal stays part of ItemCard: it gets ItemCard's props and state, and unmounts with it.</text>
<text x="24" y="306" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">Only its Instances are parented to a top layer, so nothing in the shop can cover or clip it.</text>
</svg>
