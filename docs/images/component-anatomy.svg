<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 456" width="920" height="456">
<title>anatomy of a component</title>
<rect width="920" height="456" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="20" y="16" width="480" height="426" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text xml:space="preserve" x="34" y="40" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">local ItemRow = require("./ItemRow")</text>
<text xml:space="preserve" x="34" y="62" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328"></text>
<text xml:space="preserve" x="34" y="84" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">return Rivue.defineComponent({</text>
<text xml:space="preserve" x="34" y="106" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">    name = "Inventory",</text>
<circle cx="530" cy="101" r="11" fill="#1f6feb"/>
<text x="530" y="106" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">1</text>
<line x1="500" y1="101" x2="518" y2="101" stroke="#1f6feb" stroke-width="2"/>
<text x="550" y="106" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">name: shows in errors, warnings and the Explorer</text>
<text xml:space="preserve" x="34" y="128" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">    components = { ItemRow = ItemRow },</text>
<circle cx="530" cy="123" r="11" fill="#1f6feb"/>
<text x="530" y="128" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">2</text>
<line x1="500" y1="123" x2="518" y2="123" stroke="#1f6feb" stroke-width="2"/>
<text x="550" y="128" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">components it uses by name</text>
<text xml:space="preserve" x="34" y="150" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">    props = { items = { type = "table" } },</text>
<circle cx="530" cy="145" r="11" fill="#1f6feb"/>
<text x="530" y="150" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">3</text>
<line x1="500" y1="145" x2="518" y2="145" stroke="#1f6feb" stroke-width="2"/>
<text x="550" y="150" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">props it accepts (validated in Studio)</text>
<text xml:space="preserve" x="34" y="172" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">    emits = { "select" },</text>
<circle cx="530" cy="167" r="11" fill="#1f6feb"/>
<text x="530" y="172" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">4</text>
<line x1="500" y1="167" x2="518" y2="167" stroke="#1f6feb" stroke-width="2"/>
<text x="550" y="172" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">events it sends to its parent</text>
<text xml:space="preserve" x="34" y="194" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">    styles = { list = { ... } },</text>
<circle cx="530" cy="189" r="11" fill="#1f6feb"/>
<text x="530" y="194" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">5</text>
<line x1="500" y1="189" x2="518" y2="189" stroke="#1f6feb" stroke-width="2"/>
<text x="550" y="194" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">styles only this component uses</text>
<text xml:space="preserve" x="34" y="216" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328"></text>
<text xml:space="preserve" x="34" y="238" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">    setup = function(props, ctx)</text>
<circle cx="530" cy="233" r="11" fill="#1f6feb"/>
<text x="530" y="238" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">6</text>
<line x1="500" y1="233" x2="518" y2="233" stroke="#1f6feb" stroke-width="2"/>
<text x="550" y="238" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">setup: state, functions, watchers, hooks. Runs once</text>
<text xml:space="preserve" x="34" y="260" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">        local selectedId = Rivue.ref(nil)</text>
<text xml:space="preserve" x="34" y="282" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">        return { selectedId = selectedId, ... }</text>
<text xml:space="preserve" x="34" y="304" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">    end,</text>
<text xml:space="preserve" x="34" y="326" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328"></text>
<text xml:space="preserve" x="34" y="348" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">    render = function(ctx)</text>
<circle cx="530" cy="343" r="11" fill="#1f6feb"/>
<text x="530" y="348" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">7</text>
<line x1="500" y1="343" x2="518" y2="343" stroke="#1f6feb" stroke-width="2"/>
<text x="550" y="348" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">render: markup only. Runs when state it read changes</text>
<text xml:space="preserve" x="34" y="370" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">        return h("ScrollingFrame", { class = "list" }, ...)</text>
<text xml:space="preserve" x="34" y="392" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">    end,</text>
<text xml:space="preserve" x="34" y="414" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">})</text>
</svg>
