<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 340" width="424" height="340">
<title>flex</title>
<rect width="424" height="340" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text xml:space="preserve" x="24" y="36" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1f2328">layout = "horizontal"   (row 360 px wide)</text>
<text x="24" y="70" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">no flex</text>
<rect x="24" y="78" width="376" height="56" rx="8" fill="#eef2f7" stroke="#d0d7de"/>
<rect x="32" y="86" width="100" height="40" rx="6" fill="#1f6feb"/><text x="82.0" y="111.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Label</text>
<rect x="140" y="86" width="80" height="40" rx="6" fill="#2fbf8f"/><text x="180.0" y="111.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">On</text>
<text x="24" y="162" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">flex = "fill" on the label</text>
<rect x="24" y="170" width="376" height="56" rx="8" fill="#eef2f7" stroke="#d0d7de"/>
<rect x="32" y="178" width="272" height="40" rx="6" fill="#1f6feb"/><text x="168.0" y="203.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Label  (fills the rest)</text>
<rect x="312" y="178" width="80" height="40" rx="6" fill="#2fbf8f"/><text x="352.0" y="203.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">On</text>
<text x="24" y="254" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">flex = 1 and flex = 2</text>
<rect x="24" y="262" width="376" height="56" rx="8" fill="#eef2f7" stroke="#d0d7de"/>
<rect x="32" y="270" width="116" height="40" rx="6" fill="#1f6feb"/><text x="90.0" y="295.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">1</text>
<rect x="156" y="270" width="236" height="40" rx="6" fill="#1f6feb"/><text x="274.0" y="295.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">2  (twice the extra space)</text>
</svg>
