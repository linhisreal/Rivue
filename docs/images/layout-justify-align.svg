<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 360" width="890" height="360">
<title>justify and align</title>
<rect width="890" height="360" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="40" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1f2328">justify = "start"</text>
<rect x="24" y="50" width="372" height="48" rx="8" fill="#eef2f7" stroke="#d0d7de"/>
<rect x="32" y="58" width="60" height="32" rx="6" fill="#1f6feb"/><text x="62.0" y="79.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">1</text>
<rect x="100" y="58" width="60" height="32" rx="6" fill="#1f6feb"/><text x="130.0" y="79.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">2</text>
<rect x="168" y="58" width="60" height="32" rx="6" fill="#1f6feb"/><text x="198.0" y="79.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">3</text>
<text x="24" y="124" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1f2328">justify = "center"</text>
<rect x="24" y="134" width="372" height="48" rx="8" fill="#eef2f7" stroke="#d0d7de"/>
<rect x="112.0" y="142" width="60" height="32" rx="6" fill="#1f6feb"/><text x="142.0" y="163.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">1</text>
<rect x="180.0" y="142" width="60" height="32" rx="6" fill="#1f6feb"/><text x="210.0" y="163.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">2</text>
<rect x="248.0" y="142" width="60" height="32" rx="6" fill="#1f6feb"/><text x="278.0" y="163.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">3</text>
<text x="24" y="208" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1f2328">justify = "end"</text>
<rect x="24" y="218" width="372" height="48" rx="8" fill="#eef2f7" stroke="#d0d7de"/>
<rect x="192" y="226" width="60" height="32" rx="6" fill="#1f6feb"/><text x="222.0" y="247.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">1</text>
<rect x="260" y="226" width="60" height="32" rx="6" fill="#1f6feb"/><text x="290.0" y="247.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">2</text>
<rect x="328" y="226" width="60" height="32" rx="6" fill="#1f6feb"/><text x="358.0" y="247.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">3</text>
<text x="24" y="292" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1f2328">justify = "space-between"</text>
<rect x="24" y="302" width="372" height="48" rx="8" fill="#eef2f7" stroke="#d0d7de"/>
<rect x="32" y="310" width="60" height="32" rx="6" fill="#1f6feb"/><text x="62.0" y="331.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">1</text>
<rect x="180.0" y="310" width="60" height="32" rx="6" fill="#1f6feb"/><text x="210.0" y="331.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">2</text>
<rect x="328" y="310" width="60" height="32" rx="6" fill="#1f6feb"/><text x="358.0" y="331.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">3</text>
<text x="440" y="40" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">align = "start"</text>
<rect x="440" y="56" width="130" height="140" rx="8" fill="#eef2f7" stroke="#d0d7de"/>
<rect x="450" y="64" width="32" height="40" rx="6" fill="#1f6feb"/><text x="466.0" y="89.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">1</text>
<rect x="488" y="64" width="32" height="70" rx="6" fill="#1f6feb"/><text x="504.0" y="104.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">2</text>
<rect x="526" y="64" width="32" height="28" rx="6" fill="#1f6feb"/><text x="542.0" y="83.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">3</text>
<text x="590" y="40" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">align = "center"</text>
<rect x="590" y="56" width="130" height="140" rx="8" fill="#eef2f7" stroke="#d0d7de"/>
<rect x="600" y="106.0" width="32" height="40" rx="6" fill="#1f6feb"/><text x="616.0" y="131.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">1</text>
<rect x="638" y="91.0" width="32" height="70" rx="6" fill="#1f6feb"/><text x="654.0" y="131.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">2</text>
<rect x="676" y="112.0" width="32" height="28" rx="6" fill="#1f6feb"/><text x="692.0" y="131.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">3</text>
<text x="740" y="40" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">align = "end"</text>
<rect x="740" y="56" width="130" height="140" rx="8" fill="#eef2f7" stroke="#d0d7de"/>
<rect x="750" y="148" width="32" height="40" rx="6" fill="#1f6feb"/><text x="766.0" y="173.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">1</text>
<rect x="788" y="118" width="32" height="70" rx="6" fill="#1f6feb"/><text x="804.0" y="158.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">2</text>
<rect x="826" y="160" width="32" height="28" rx="6" fill="#1f6feb"/><text x="842.0" y="179.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">3</text>
<text x="440" y="226" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">In a horizontal row: justify moves items along the row,</text>
<text x="440" y="246" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">align moves them up and down. In a vertical list it's the other way.</text>
<text x="440" y="286" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">justify also takes "space-around" and "space-evenly".</text>
</svg>
