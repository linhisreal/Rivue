<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300">
<title>a store module</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
<rect width="780" height="300" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="290" y="40" width="220" height="150" rx="6" fill="#eef2f7" stroke="#d0d7de"/><text x="400.0" y="120.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328"></text>
<text x="400" y="64" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Inventory store</text>
<rect x="306" y="78" width="188" height="44" rx="6" fill="#1f6feb"/><text x="400.0" y="97.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">state</text><text x="400.0" y="115.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fff">read-only outside</text>
<rect x="306" y="132" width="188" height="44" rx="6" fill="#2fbf8f"/><text x="400.0" y="151.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">buy(id), equip(id)</text><text x="400.0" y="169.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fff">the only writers</text>
<rect x="24" y="40" width="150" height="40" rx="6" fill="#eef2f7" stroke="#d0d7de"/><text x="99.0" y="65.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Hud</text>
<rect x="24" y="96" width="150" height="40" rx="6" fill="#eef2f7" stroke="#d0d7de"/><text x="99.0" y="121.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Shop</text>
<rect x="24" y="152" width="150" height="40" rx="6" fill="#eef2f7" stroke="#d0d7de"/><text x="99.0" y="177.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Backpack</text>
<path d="M300 100 C250 100 230 60 180 60" stroke="#1f6feb" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M300 100 C250 100 230 116 180 116" stroke="#1f6feb" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M300 100 C250 100 230 172 180 172" stroke="#1f6feb" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="232" y="96" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f6feb">read</text>
<path d="M180 124 C240 150 250 156 300 156" stroke="#2fbf8f" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="400" y="214" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2fbf8f">Shop calls buy(); only the store writes</text>
<rect x="640" y="80" width="120" height="60" rx="6" fill="#eef2f7" stroke="#d0d7de"/><text x="700.0" y="115.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Server</text>
<path d="M506 140 C570 140 580 120 634 120" stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M634 100 C580 100 570 92 506 92" stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="570" y="74" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">Remote</text>
<text x="24" y="256" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">Components only read the state. Every change goes through the store's functions, so when a value</text>
<text x="24" y="276" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">is wrong there's one file to look in. Every component that read a value updates when it changes.</text>
</svg>
