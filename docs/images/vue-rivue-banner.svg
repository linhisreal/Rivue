<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <title>Vue / Rivue</title>
  <defs>
    <clipPath id="banner"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#banner)">
    <!-- Vue side: a light tint of Vue green, so the full-colour logo still reads -->
    <polygon points="0,0 662,0 582,320 0,320" fill="#e3f6ec"/>
    <!-- Rivue side: a light tint of Studio blue, so the blue tile still reads -->
    <polygon points="618,0 1200,0 1200,320 538,320" fill="#e2edfd"/>
    <!-- The slash between them -->
    <polygon points="618,0 662,0 582,320 538,320" fill="#1f2328"/>
  </g>
  <!-- Vue logo -->
  <g transform="translate(214 85) scale(0.662)">
    <path d="M161.096.001l-30.225 52.351L100.647.001H-.005l130.877 226.688L261.749.001z" fill="#41b883"/>
    <path d="M161.096.001l-30.225 52.351L100.647.001H52.346l78.526 136.01L209.398.001z" fill="#34495e"/>
  </g>
  <!-- Rivue icon -->
  <g transform="translate(804 64) scale(0.75)">
    <rect x="24" y="24" width="208" height="208" rx="48" fill="#1f6feb" transform="rotate(-15 128 128)"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M68.0 80 L128 184 L188.0 80" stroke="#ffffff" stroke-width="28"/>
      <path d="M106.6 82 L128 119.0 L149.4 82" stroke="#7ee8c0" stroke-width="17"/>
    </g>
  </g>
</svg>
