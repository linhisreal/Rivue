<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330">
<title>What one state change touches in React-lua, Fusion and Rivue</title>
<rect width="760" height="330" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<text x="130" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">React-lua</text>
<text x="380" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Fusion</text>
<text x="630" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Rivue</text>
<text x="130" y="52" text-anchor="middle" font-size="12" fill="#59636e">coins changes in Shop's state</text>
<text x="380" y="52" text-anchor="middle" font-size="12" fill="#59636e">coins is a Value</text>
<text x="630" y="52" text-anchor="middle" font-size="12" fill="#59636e">coins is a ref</text>
</g>
<g stroke="#8c959f" stroke-width="1.5">
<line x1="130" y1="92" x2="130" y2="112"/><line x1="130" y1="142" x2="74" y2="166"/><line x1="130" y1="142" x2="186" y2="166"/>
<line x1="630" y1="92" x2="630" y2="112"/><line x1="630" y1="142" x2="574" y2="166"/><line x1="630" y1="142" x2="686" y2="166"/>
</g>
<g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
<rect x="80" y="66" width="100" height="26" rx="5" fill="#eaeef2"/><text x="130" y="84" fill="#1f2328">App</text>
<rect x="80" y="116" width="100" height="26" rx="5" fill="#fb8f44"/><text x="130" y="134" fill="#fff">Shop</text>
<rect x="27" y="166" width="94" height="26" rx="5" fill="#fb8f44"/><text x="74" y="184" fill="#fff">ItemList</text>
<rect x="139" y="166" width="94" height="26" rx="5" fill="#fb8f44"/><text x="186" y="184" fill="#fff">CoinLabel</text>

<rect x="580" y="66" width="100" height="26" rx="5" fill="#eaeef2"/><text x="630" y="84" fill="#1f2328">App</text>
<rect x="580" y="116" width="100" height="26" rx="5" fill="#eaeef2"/><text x="630" y="134" fill="#1f2328">Shop</text>
<rect x="527" y="166" width="94" height="26" rx="5" fill="#eaeef2"/><text x="574" y="184" fill="#1f2328">ItemList</text>
<rect x="639" y="166" width="94" height="26" rx="5" fill="#fb8f44"/><text x="686" y="184" fill="#fff">CoinLabel</text>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" xml:space="preserve">
<rect x="300" y="72" width="160" height="120" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="312" y="94" fill="#59636e">TextLabel</text>
<text x="330" y="116" fill="#59636e">Size</text>
<rect x="306" y="126" width="148" height="20" rx="3" fill="#fb8f44"/>
<text x="330" y="140" fill="#fff">Text = Computed</text>
<text x="330" y="164" fill="#59636e">Font</text>
<text x="330" y="184" fill="#59636e">TextColor3</text>
</g>
<g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" text-anchor="middle">
<text x="130" y="222">Shop and everything under it</text>
<text x="130" y="240">re-render, unless you add</text>
<text x="130" y="258">React.memo or bindings</text>
<text x="380" y="222">only the property bound to</text>
<text x="380" y="240">the value updates; there are</text>
<text x="380" y="258">no components to re-render</text>
<text x="630" y="222">only the component whose</text>
<text x="630" y="240">render read coins re-renders,</text>
<text x="630" y="258">and only changed props are written</text>
</g>
<g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">
<rect x="270" y="292" width="14" height="14" rx="3" fill="#fb8f44"/>
<text x="292" y="304">re-runs or updates when coins changes</text>
</g>
</svg>
