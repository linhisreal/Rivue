<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
<title>The Rivue DevTools window</title>
<rect width="760" height="400" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="24" y="20" width="380" height="360" rx="6" fill="#252525"/>
<text x="36" y="40" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#969696">Rivue 2.57.0 · 4 components</text>
<rect x="36" y="50" width="356" height="24" rx="3" fill="#2e2e2e"/>
<text x="44" y="66" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#787878">Filter by name</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<text x="44" y="98" fill="#dcdcdc" xml:space="preserve">&lt;App&gt;  1</text>
<text x="44" y="120" fill="#dcdcdc" xml:space="preserve">  &lt;Shop&gt;  3</text>
<rect x="36" y="127" width="356" height="22" fill="#1f6feb"/>
<text x="44" y="142" fill="#ffffff" xml:space="preserve">    &lt;ShopRow&gt;  3</text>
<text x="44" y="164" fill="#ffaa3c" xml:space="preserve">    &lt;Ping&gt;  58</text>
</g>
<line x1="36" y1="196" x2="392" y2="196" stroke="#3a3a3a"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c8c8c8">
<text x="44" y="216" xml:space="preserve">&lt;ShopRow&gt;  rendered 3×</text>
<text x="44" y="244">Props</text>
<text x="44" y="262">item = table</text>
<text x="44" y="280">selected = true</text>
<text x="44" y="308">State</text>
<text x="44" y="326">(none)</text>
</g>
<g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
<path d="M420 40 L404 40" stroke="#59636e"/>
<text x="428" y="44">how many components are mounted</text>
<path d="M420 62 L396 62" stroke="#59636e"/>
<text x="428" y="66">type to narrow the list</text>
<path d="M420 120 L396 120" stroke="#59636e"/>
<text x="428" y="112">indented under its parent,</text>
<text x="428" y="128">with its render count</text>
<path d="M420 142 L396 142" stroke="#59636e"/>
<text x="428" y="146" fill="#1f6feb">selected: also selected in the Explorer</text>
<path d="M420 164 L396 164" stroke="#59636e"/>
<text x="428" y="168" fill="#bc4c00">orange: rendered again since the last refresh</text>
<path d="M420 262 L396 262" stroke="#59636e"/>
<text x="428" y="258">props and state of the selected</text>
<text x="428" y="274">component, values summarised</text>
</g>
</svg>
