<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 338" width="800" height="338">
<title>the parts of a Tabs component</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
<rect width="800" height="338" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="24" y="24" width="420" height="290" rx="10" fill="#ffffff" stroke="#1f6feb" stroke-width="2" stroke-dasharray="7 5"/>
<text x="36" y="46" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f6feb">Tabs</text>
<rect x="40" y="62" width="110" height="40" rx="6" fill="#1f6feb"/><text x="95.0" y="87.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Shop</text>
<rect x="160" y="62" width="110" height="40" rx="6" fill="#eef2f7" stroke="#d0d7de"/><text x="215.0" y="87.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Bag</text>
<rect x="40" y="116" width="388" height="182" rx="8" fill="#eef2f7" stroke="#d0d7de"/>
<rect x="54" y="130" width="360" height="40" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="68" y="155" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">Iron Sword</text>
<text x="400" y="155" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">40 coins</text>
<rect x="54" y="182" width="360" height="40" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="68" y="207" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">Wood Shield</text>
<text x="400" y="207" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">25 coins</text>
<rect x="54" y="234" width="360" height="40" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="68" y="259" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">Potion</text>
<text x="400" y="259" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">10 coins</text>
<path d="M488 47 H450" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M488 120 C400 120 360 84 284 84" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M488 206 H442" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="496" y="52" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Tabs</text>
<text x="496" y="72" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">Holds which tab is active, and</text>
<text x="496" y="90" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">provides it to everything inside.</text>
<text x="496" y="124" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Tab  (one per button)</text>
<text x="496" y="144" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">Highlights itself when active.</text>
<text x="496" y="162" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">Clicking it calls select(name).</text>
<text x="496" y="196" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">TabPanel  (one per page)</text>
<text x="496" y="216" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">Shows its content only while</text>
<text x="496" y="234" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">its tab is active. The Bag panel</text>
<text x="496" y="252" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">renders nothing right now.</text>
<text x="496" y="290" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328">No props are passed between them:</text>
<text x="496" y="308" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328">they all inject the same state.</text>
</svg>
