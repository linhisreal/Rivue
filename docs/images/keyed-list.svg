<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320">
<title>keyed list update</title>
<rect width="760" height="320" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
<text x="24" y="30" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">Before</text>
<rect x="24" y="42" width="120" height="44" rx="6" fill="#1f6feb"/><text x="84.0" y="69.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Sword</text><text x="84" y="104" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">key = 1</text>
<rect x="174" y="42" width="120" height="44" rx="6" fill="#1f6feb"/><text x="234.0" y="69.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Bow</text><text x="234" y="104" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">key = 2</text>
<rect x="324" y="42" width="120" height="44" rx="6" fill="#1f6feb"/><text x="384.0" y="69.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Potion</text><text x="384" y="104" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">key = 3</text>
<text x="316" y="226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">After removing Bow</text>
<rect x="24" y="198" width="120" height="44" rx="6" fill="#1f6feb"/><text x="84.0" y="225.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Sword</text><text x="84" y="260" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">key = 1</text>
<rect x="174" y="198" width="120" height="44" rx="6" fill="#1f6feb"/><text x="234.0" y="225.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Potion</text><text x="234" y="260" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">key = 3</text>
<path d="M84 114 L84 192" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M384 114 C384 160 234 150 234 192" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="234" y="140" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#cf222e">✕</text>
<text x="474" y="70" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">With keys, Rivue matches rows by key:</text>
<text x="474" y="90" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">Sword and Potion keep their Instances,</text>
<text x="474" y="110" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">only Bow is destroyed.</text>
<text x="474" y="256" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">Without keys it matches by position:</text>
<text x="474" y="276" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">row 2 is rewritten to show Potion and</text>
<text x="474" y="296" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">row 3 is destroyed.</text>
</svg>
