<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="880" height="150">
<title>the steps of a component test</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
<rect width="880" height="150" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="24" y="30" width="150" height="64" rx="6" fill="#1f6feb"/><text x="99.0" y="59.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">1. Mount</text><text x="99.0" y="77.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fff">Rivue.mount(...)</text>
<rect x="194" y="30" width="150" height="64" rx="6" fill="#1f6feb"/><text x="269.0" y="59.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">2. Act</text><text x="269.0" y="77.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fff">testing.trigger(...)</text>
<path d="M176 62 H190" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="364" y="30" width="150" height="64" rx="6" fill="#2fbf8f"/><text x="439.0" y="59.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">3. Wait</text><text x="439.0" y="77.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fff">Rivue.nextTick()</text>
<path d="M346 62 H360" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="534" y="30" width="150" height="64" rx="6" fill="#1f6feb"/><text x="609.0" y="59.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">4. Check</text><text x="609.0" y="77.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fff">assert(...)</text>
<path d="M516 62 H530" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="704" y="30" width="150" height="64" rx="6" fill="#1f6feb"/><text x="779.0" y="59.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">5. Clean up</text><text x="779.0" y="77.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fff">app:unmount()</text>
<path d="M686 62 H700" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="24" y="128" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">Step 3 is the one people forget: re-renders are batched, so Instances only change after nextTick().</text>
</svg>
