<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190">
<title>the steps of a component test</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
<rect width="880" height="190" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="40" cy="40" r="12" fill="#1f6feb"/>
<text x="40" y="45" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">1</text>
<text x="60" y="45" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Mount</text>
<rect x="24" y="62" width="140" height="36" rx="6" fill="#f6f8fa" stroke="#1f6feb" stroke-width="2"/>
<text xml:space="preserve" x="94.0" y="85" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">Rivue.mount()</text>
<text x="94.0" y="120" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">into a spare Frame</text>
<circle cx="212" cy="40" r="12" fill="#1f6feb"/>
<text x="212" y="45" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">2</text>
<text x="232" y="45" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Act</text>
<rect x="196" y="62" width="140" height="36" rx="6" fill="#f6f8fa" stroke="#1f6feb" stroke-width="2"/>
<text xml:space="preserve" x="266.0" y="85" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">testing.trigger()</text>
<text x="266.0" y="120" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">click or type</text>
<path d="M170 80 H190" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<circle cx="384" cy="40" r="12" fill="#2fbf8f"/>
<text x="384" y="45" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">3</text>
<text x="404" y="45" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Wait</text>
<rect x="368" y="62" width="140" height="36" rx="6" fill="#f6f8fa" stroke="#2fbf8f" stroke-width="2"/>
<text xml:space="preserve" x="438.0" y="85" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">Rivue.nextTick()</text>
<text x="438.0" y="120" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">let it re-render</text>
<path d="M342 80 H362" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<circle cx="556" cy="40" r="12" fill="#1f6feb"/>
<text x="556" y="45" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">4</text>
<text x="576" y="45" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Check</text>
<rect x="540" y="62" width="140" height="36" rx="6" fill="#f6f8fa" stroke="#1f6feb" stroke-width="2"/>
<text xml:space="preserve" x="610.0" y="85" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">assert()</text>
<text x="610.0" y="120" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">read Text, Visible</text>
<path d="M514 80 H534" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<circle cx="728" cy="40" r="12" fill="#1f6feb"/>
<text x="728" y="45" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">5</text>
<text x="748" y="45" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Clean up</text>
<rect x="712" y="62" width="140" height="36" rx="6" fill="#f6f8fa" stroke="#1f6feb" stroke-width="2"/>
<text xml:space="preserve" x="782.0" y="85" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">app:unmount()</text>
<text x="782.0" y="120" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">for the next test</text>
<path d="M686 80 H706" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<line x1="24" y1="142" x2="856" y2="142" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="168" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e">Step 3 is the one people forget. Re-renders are batched, so the Instances only change after Rivue.nextTick().</text>
</svg>
